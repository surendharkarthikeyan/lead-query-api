databaseChangeLog:
  - changeSet:
      id: 007-create-custom-fields
      author: surendhar

      changes:

        - createTable:
            tableName: custom_fields

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: label
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: custom_fields
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
            constraintName: fk_custom_fields_tenant

        - addUniqueConstraint:
            tableName: custom_fields
            columnNames: tenant_id, label
            constraintName: uk_custom_fields_tenant_label

        - createIndex:
            tableName: custom_fields
            indexName: idx_custom_fields_tenant_id
            columns:
              - column:
                  name: tenant_id